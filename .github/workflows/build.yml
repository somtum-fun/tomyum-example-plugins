name: build

on:
  push:
  pull_request:

jobs:
  plugins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: examples
      - uses: actions/checkout@v4
        with:
          repository: somtum-fun/TomYum-OSS
          path: TomYum-OSS
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build
        working-directory: examples
        run: dotnet build -c Release -p:TomYumRoot=$GITHUB_WORKSPACE/TomYum-OSS
      - name: Test
        working-directory: examples
        run: dotnet test -c Release --no-build -p:TomYumRoot=$GITHUB_WORKSPACE/TomYum-OSS

  analyzer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: pip install -r analyzer/requirements.txt
      - name: Import check
        run: python -c "import sys; sys.path.insert(0, 'analyzer'); import analyzer; print('ok')"
